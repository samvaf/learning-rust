name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bazel:
    name: Bazel build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Installs the Bazel pinned in .bazelversion and caches bazelisk, the
      # repository cache and the disk cache across runs.
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Build
        run: bazel build //...

      - name: Test
        run: bazel test //...
